[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-token-farm"
version = "1.0.0"
description = "Generate real token usage traffic through CC Switch local proxy — model-aware, price-aware CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "cc-token-farm contributors" }
]
keywords = [
  "cc-switch",
  "token",
  "usage",
  "proxy",
  "claude",
  "codex",
  "openai",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/tytsxai/cc-token-farm"
Repository = "https://github.com/tytsxai/cc-token-farm"
Issues = "https://github.com/tytsxai/cc-token-farm/issues"

[project.scripts]
cc-token-farm = "cc_token_farm.cli:main"
farm = "cc_token_farm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cc_token_farm = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
