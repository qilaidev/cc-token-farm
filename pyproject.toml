[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-token-farm"
version = "1.1.0"
description = "CC Switch token usage generator: real Anthropic/OpenAI traffic via local proxy, model pricing, cost estimate & hard budget — no SQLite forgery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "cc-token-farm contributors" }
]
keywords = [
  "cc-switch",
  "token-usage",
  "usage-dashboard",
  "local-proxy",
  "anthropic",
  "claude",
  "openai",
  "codex",
  "llm",
  "cli",
  "cost-estimate",
  "model-pricing",
  "prompt-cache",
  "load-test",
  "token-farm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
dependencies = [
  # tomllib is stdlib on 3.11+; keep 3.10 TOML configs working without breaking zero-dep on 3.11+
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/tytsxai/cc-token-farm"
Repository = "https://github.com/tytsxai/cc-token-farm"
Issues = "https://github.com/tytsxai/cc-token-farm/issues"
Changelog = "https://github.com/tytsxai/cc-token-farm/blob/main/CHANGELOG.md"
Documentation = "https://github.com/tytsxai/cc-token-farm#readme"

[project.scripts]
cc-token-farm = "cc_token_farm.cli:main"
farm = "cc_token_farm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cc_token_farm = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
